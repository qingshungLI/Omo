<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E8EBBD">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2398A84E'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-size='34' font-weight='700' fill='%23FDFAF2'%3ER%3C/text%3E%3C/svg%3E">
  <title>Recallo · iOS 交互预览</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #98A84E;
      --primary-action: #A5AE66;
      --page: #E8EBBD;
      --cream: #FDFAF2;
      --nav: #FCF8ED;
      --text: #44423D;
      --text-2: #676767;
      --muted: #8C8B82;
      --border: #E0E5BA;
      --upload: #E8E9C2;
      --wrong: #FD9789;
      --blue: #94D0E9;
      --desktop: #F3F2EA;
      --shadow: 0 18px 54px rgba(74, 78, 48, 0.16);
      --soft-shadow: 0 4px 10px rgba(152, 163, 94, 0.2);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
        "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--desktop);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(79, 135, 185, 0.58);
      outline-offset: 3px;
    }

    .preview-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 380px) minmax(390px, 520px);
      place-content: center;
      align-items: center;
      gap: clamp(32px, 6vw, 96px);
      padding: 24px;
    }

    .preview-copy {
      max-width: 360px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      font-size: 17px;
      font-weight: 700;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: var(--cream);
      background: var(--primary);
      box-shadow: var(--soft-shadow);
    }

    .preview-copy h1 {
      margin: 0;
      max-width: 350px;
      font-size: clamp(34px, 4vw, 52px);
      line-height: 1.08;
      letter-spacing: -0.045em;
    }

    .preview-copy > p {
      margin: 20px 0 0;
      color: var(--text-2);
      font-size: 16px;
      line-height: 1.75;
    }

    .steps {
      display: grid;
      gap: 14px;
      margin: 34px 0;
      padding: 0;
      list-style: none;
    }

    .steps li {
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: start;
      gap: 11px;
      color: var(--text-2);
      font-size: 14px;
      line-height: 1.55;
    }

    .step-number {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(152, 168, 78, 0.45);
      border-radius: 9px;
      color: var(--primary);
      background: rgba(253, 250, 242, 0.72);
      font-size: 12px;
      font-weight: 700;
    }

    .preview-note {
      padding: 14px 16px;
      border-left: 3px solid var(--primary);
      background: rgba(253, 250, 242, 0.7);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .reset-button {
      margin-top: 18px;
      padding: 0;
      border: 0;
      border-bottom: 1px solid currentColor;
      color: var(--text-2);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
    }

    .device {
      position: relative;
      width: 414px;
      height: min(884px, calc(100vh - 36px));
      min-height: 700px;
      justify-self: center;
      overflow: hidden;
      border: 10px solid #292A27;
      border-radius: 52px;
      background: var(--page);
      box-shadow: var(--shadow), 0 0 0 1px rgba(0, 0, 0, 0.12);
    }

    .device::before {
      content: "";
      position: absolute;
      z-index: 80;
      top: 10px;
      left: 50%;
      width: 92px;
      height: 25px;
      border-radius: 18px;
      background: #292A27;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--page);
    }

    .status-bar {
      position: absolute;
      z-index: 70;
      top: 0;
      left: 0;
      right: 0;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 23px 0;
      color: #292A27;
      font-size: 12px;
      font-weight: 700;
      pointer-events: none;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .signal {
      width: 15px;
      height: 10px;
      border-bottom: 3px solid currentColor;
      border-left: 3px solid transparent;
      border-right: 3px solid transparent;
    }

    .battery {
      width: 20px;
      height: 10px;
      border: 1.5px solid currentColor;
      border-radius: 3px;
      position: relative;
    }

    .battery::before {
      content: "";
      position: absolute;
      inset: 1.5px;
      border-radius: 1px;
      background: currentColor;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 2px;
      width: 1.5px;
      height: 4px;
      border-radius: 1px;
      background: currentColor;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding-top: 46px;
      overflow: hidden;
      background: var(--page);
      animation: screen-in 240ms ease-out;
    }

    @keyframes screen-in {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .top-chrome {
      z-index: 4;
      height: 60px;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .circle-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--cream);
      color: var(--text);
      box-shadow: var(--soft-shadow);
      cursor: pointer;
    }

    .circle-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .top-title {
      font-size: 18px;
      font-weight: 650;
      color: #575757;
    }

    .screen-scroll {
      position: relative;
      z-index: 2;
      min-height: 0;
      flex: 1;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }

    .screen-scroll::-webkit-scrollbar {
      display: none;
    }

    .home-content {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 24px 126px;
      text-align: center;
    }

    .home-content h2 {
      margin: 0;
      font-size: 25px;
      line-height: 1.25;
      letter-spacing: -0.025em;
    }

    .home-subtitle {
      margin: 9px 0 0;
      color: rgba(103, 103, 103, 0.76);
      font-size: 14px;
    }

    .memory-pools {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin: auto 0 24px;
    }

    .memory-pool {
      min-height: 226px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 17px 8px;
      border: 1px solid rgba(152, 168, 78, 0.24);
      border-radius: 19px;
      color: var(--text);
      background: rgba(253, 250, 242, 0.7);
      box-shadow: 0 4px 12px rgba(112, 120, 62, 0.08);
      cursor: pointer;
      transition: transform 260ms cubic-bezier(.34,1.56,.64,1), border-color 180ms ease, background 180ms ease;
    }

    .memory-pool:hover { border-color: rgba(152, 168, 78, 0.7); }
    .memory-pool:active { transform: scale(.97); }
    .memory-pool.selected {
      border-color: var(--primary);
      background: var(--cream);
      box-shadow: 0 7px 20px rgba(112, 120, 62, 0.18);
      transform: translateY(-5px) rotate(-5deg);
    }

    .pool-symbol {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(152, 168, 78, 0.28);
      border-radius: 14px;
      color: var(--primary);
      background: rgba(232, 235, 189, 0.42);
      font-size: 20px;
    }

    .pool-title {
      font-size: 14px;
      font-weight: 750;
      line-height: 1.25;
    }

    .pool-copy {
      min-height: 32px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.45;
    }

    .pool-count {
      color: var(--primary);
      font-size: 11px;
      font-weight: 750;
    }

    .card-stack {
      position: relative;
      width: 178px;
      height: 126px;
      margin: 18px 0 20px;
      border: 0;
      background: transparent;
      cursor: grab;
      touch-action: none;
      transition: transform 200ms cubic-bezier(.34,1.56,.64,1);
    }

    .card-stack:active { cursor: grabbing; }

    .stack-card {
      position: absolute;
      top: 8px;
      left: 22px;
      width: 134px;
      height: 98px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(253, 250, 242, 0.84);
      box-shadow: var(--soft-shadow);
    }

    .stack-card:nth-child(1) {
      opacity: 0.72;
      transform: translate(-18px, 13px) rotate(-7deg);
    }

    .stack-card:nth-child(2) {
      opacity: 0.84;
      transform: translate(19px, 7px) rotate(6deg);
    }

    .stack-card.front {
      display: grid;
      place-items: center;
      opacity: 1;
      transform: none;
    }

    .stack-card-content {
      display: grid;
      justify-items: center;
      gap: 4px;
    }

    .sparkle {
      width: 30px;
      height: 30px;
      color: var(--primary);
    }

    .stack-title {
      font-size: 13px;
      font-weight: 700;
    }

    .stack-subtitle {
      color: var(--muted);
      font-size: 11px;
    }

    .button-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .primary-button,
    .secondary-button {
      min-height: 53px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 650;
    }

    .primary-button {
      border: 1px solid var(--primary-action);
      background: var(--primary-action);
      color: #fffef6;
      box-shadow: 0 3px 7px rgba(125, 136, 61, 0.18);
    }

    .secondary-button {
      border: 1px solid var(--primary);
      background: var(--cream);
      color: var(--primary);
    }

    .helper-copy {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .bottom-nav {
      position: absolute;
      z-index: 30;
      right: 18px;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 18px;
      height: 86px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      padding: 0 7px;
      border-radius: 29px;
      background: var(--nav);
      box-shadow: var(--soft-shadow);
    }

    .nav-button {
      height: 62px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 1px;
      padding: 0;
      border: 0;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
    }

    .nav-button img {
      width: 32px;
      height: 32px;
    }

    .nav-button.active {
      color: var(--primary);
    }

    .nav-button img { opacity: .72; }
    .nav-button.active img { opacity: 1; filter: sepia(.2) saturate(1.3); }

    .upload-content {
      position: relative;
      min-height: 100%;
      padding: 15px 24px 126px;
    }

    .upload-lead {
      position: relative;
      min-height: 192px;
      padding-top: 18px;
      text-align: center;
    }

    .upload-lead h2 {
      max-width: 290px;
      margin: 0 auto;
      font-size: 23px;
      line-height: 1.34;
      letter-spacing: -0.02em;
    }

    .upload-lead p {
      margin: 9px auto 0;
      color: var(--text-2);
      font-size: 13px;
      line-height: 1.55;
    }

    .mascot {
      position: relative;
      width: 112px;
      height: 112px;
      margin: 13px auto 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .mascot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 220ms cubic-bezier(.34,1.56,.64,1);
    }

    .mascot.boop img { animation: mascot-boop 340ms cubic-bezier(.34,1.56,.64,1); }
    .mascot.success img { animation: mascot-hop 480ms cubic-bezier(.34,1.56,.64,1) 1; }

    @keyframes mascot-boop {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.12, .84); }
      68% { transform: scale(.94, 1.08); }
    }

    @keyframes mascot-hop {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-10px) scale(.96, 1.04); }
    }

    .mascot-hint {
      min-height: 20px;
      margin: 2px 0 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .upload-card {
      position: relative;
      z-index: 3;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--cream);
      box-shadow: var(--soft-shadow);
    }

    .upload-card h3 {
      margin: 0;
      font-size: 16px;
    }

    .upload-card > p {
      margin: 6px 0 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .upload-action {
      width: 100%;
      min-height: 53px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fffdf7;
      color: var(--text);
      cursor: pointer;
      font-weight: 650;
    }

    .upload-action + .upload-action {
      margin-top: 10px;
    }

    .upload-action.primary {
      border-color: var(--primary-action);
      color: #fffef6;
      background: var(--primary-action);
    }

    .upload-action svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .selected-preview {
      display: grid;
      grid-template-columns: 58px 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fffdf7;
    }

    .selected-preview img {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      object-fit: cover;
    }

    .selected-preview strong,
    .selected-preview span {
      display: block;
    }

    .selected-preview strong {
      font-size: 13px;
    }

    .selected-preview span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin: 16px 0;
      color: var(--muted);
      font-size: 11px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: var(--border);
    }

    .link-input {
      width: 100%;
      height: 47px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fffdf7;
      color: var(--text);
      font-size: 13px;
    }

    .privacy-copy {
      margin: 13px 3px 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.55;
      text-align: center;
    }

    .bg-deco {
      position: absolute;
      z-index: 1;
      opacity: 0.6;
      pointer-events: none;
    }

    .bg-deco.left {
      left: -4px;
      bottom: 93px;
      width: 114px;
    }

    .bg-deco.right {
      right: -3px;
      bottom: 90px;
      width: 105px;
    }

    .analyzing {
      min-height: 100%;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 24px;
      text-align: center;
    }

    .scan-card {
      position: relative;
      width: 238px;
      height: 318px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--cream);
      box-shadow: var(--soft-shadow);
    }

    .scan-card::after {
      content: "";
      position: absolute;
      right: 18px;
      left: 18px;
      height: 2px;
      background: var(--primary);
      box-shadow: 0 0 12px rgba(152, 168, 78, 0.55);
      animation: scanning 1.35s ease-in-out infinite;
    }

    @keyframes scanning {
      0%, 100% { top: 40px; }
      50% { top: 272px; }
    }

    .scan-core {
      display: grid;
      justify-items: center;
      gap: 14px;
      color: var(--primary);
    }

    .scan-core svg {
      width: 42px;
      height: 42px;
    }

    .analyzing h2 {
      margin: 27px 0 8px;
      font-size: 21px;
    }

    .analyzing p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .flow-top {
      height: 68px;
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      flex: 0 0 auto;
      padding: 4px 24px 12px;
    }

    .flow-top .top-title {
      text-align: center;
    }

    .summon-stage {
      position: relative;
      min-height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 42px 24px 72px;
      text-align: center;
    }

    .summon-copy {
      position: absolute;
      z-index: 5;
      top: 40px;
      left: 24px;
      right: 24px;
    }

    .summon-copy p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .summon-copy h2 {
      margin: 0;
      font-size: 22px;
    }

    .summon-stack {
      position: relative;
      width: 240px;
      height: 330px;
    }

    .summon-shadow-card,
    .summoned-card {
      position: absolute;
      inset: 0;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: var(--cream);
      box-shadow: var(--soft-shadow);
    }

    .summon-shadow-card:nth-child(1) {
      opacity: 0.5;
      transform: translate(-16px, 17px) rotate(-6deg);
    }

    .summon-shadow-card:nth-child(2) {
      opacity: 0.72;
      transform: translate(18px, 12px) rotate(5deg);
    }

    .summoned-card {
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 28px;
      animation: summon-card 1250ms cubic-bezier(.2,.8,.2,1) both;
    }

    .summoned-card .rarity,
    .summoned-card .mastery-chip {
      position: absolute;
      top: 18px;
      left: 18px;
      animation: summon-badge 200ms ease-out 1250ms both;
    }

    .summoned-card .mastery-chip {
      right: 18px;
      left: auto;
    }

    .summoned-card strong {
      font-size: 21px;
      line-height: 1.35;
    }

    .summoned-card span:last-child {
      color: var(--muted);
      font-size: 12px;
    }

    .summon-trail {
      position: absolute;
      z-index: 2;
      width: 330px;
      height: 10px;
      top: 44%;
      left: 43%;
      border-radius: 999px;
      background: rgba(79, 135, 185, 0.34);
      box-shadow: 0 0 24px rgba(79, 135, 185, 0.55);
      transform: rotate(-24deg);
      animation: summon-trail 500ms ease-out 250ms both;
    }

    .summon-trail.r { background: rgba(103, 103, 103, 0.26); }
    .summon-trail.sr {
      background: rgba(240, 138, 93, 0.42);
      box-shadow: 0 0 26px rgba(240, 138, 93, 0.45);
    }
    .summon-trail.ssr {
      background: rgba(217, 164, 65, 0.42);
      box-shadow: 0 0 28px rgba(217, 164, 65, 0.5);
    }

    .skip-summon {
      position: absolute;
      z-index: 6;
      bottom: 42px;
      padding: 7px 0;
      border: 0;
      border-bottom: 1px solid currentColor;
      color: var(--text-2);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
    }

    @keyframes summon-card {
      0% { opacity: 0; transform: translateY(64px) rotate(-4deg) scale(.86); }
      20% { opacity: 1; transform: translateY(30px) rotate(-3.5deg) scale(.94); }
      60% { transform: translateY(-6px) rotate(2.5deg) scale(1.01); }
      86% { transform: translateY(2px) rotate(-1deg) scale(1); }
      100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
    }

    @keyframes summon-trail {

      app.innerHTML = screens[state.screen]();
      bindCommonEvents();
      if (state.screen === "home") bindHomeEvents();
      if (state.screen === "upload") bindUploadEvents();

    function bindCommonEvents() {
      app.querySelectorAll("[data-nav]").forEach((button) => {
        button.addEventListener("click", () => navigate(button.dataset.nav));
      });
      app.querySelectorAll("[data-toast]").forEach((button) => {
        button.addEventListener("click", () => showToast(button.dataset.toast));
      });
    }

    function bindHomeEvents() {
      const hints = [
        "它只提醒你：抽到的是自己的过去",
        "先想一遍，再看答案",
        "忘记不会受罚，只会更早再见"
      ];
      app.querySelectorAll("[data-pool]").forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedPool = button.dataset.pool;
          render();
        });
      });
      document.getElementById("draw-one").addEventListener("click", () => startDraw("single"));
      document.getElementById("draw-many").addEventListener("click", () => startDraw("continuous"));
      const mascot = document.getElementById("mascot-button");
      mascot.addEventListener("click", () => {
        state.mascotTapCount += 1;
        mascot.classList.remove("boop");
        void mascot.offsetWidth;
        mascot.classList.add("boop");
        document.getElementById("mascot-hint").textContent = hints[state.mascotTapCount % hints.length];
        setTimeout(() => mascot.classList.remove("boop"), 340);
      });

      const stack = document.getElementById("recall-stack");
      let startY = 0;
      let startX = 0;
      let dragging = false;
      let triggered = false;
      let holdTimer;
      const resetStack = () => {
        stack.style.transform = "";
        dragging = false;
        clearTimeout(holdTimer);
      };
      stack.addEventListener("pointerdown", (event) => {
        dragging = true;
        triggered = false;
        startY = event.clientY;
        startX = event.clientX;
        stack.setPointerCapture(event.pointerId);
        holdTimer = setTimeout(() => {
          triggered = true;
          startDraw("single");
        }, 450);
      });
      stack.addEventListener("pointermove", (event) => {
        if (!dragging || triggered) return;
        const dy = Math.min(0, event.clientY - startY);
        const dx = event.clientX - startX;
        if (Math.abs(dy) > 6 || Math.abs(dx) > 6) clearTimeout(holdTimer);
        const tilt = Math.max(-4, Math.min(4, dx / 12));
        stack.style.transform = `translateY(${Math.max(-36, dy)}px) rotate(${tilt}deg) scale(${dy <= -28 ? .97 : 1})`;
      });
      const endGesture = (event) => {
        if (!dragging || triggered) return;
        const dy = event.clientY - startY;
        resetStack();
        if (dy <= -28) startDraw("single");
      };
      stack.addEventListener("pointerup", endGesture);
      stack.addEventListener("pointercancel", resetStack);
      stack.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          startDraw("single");
        }
      });
    }

    function bindSummonEvents() {
      document.getElementById("skip-summon").addEventListener("click", finishSummon);
    }

    function bindUploadEvents() {
      const input = document.getElementById("image-input");
      document.getElementById("choose-image").addEventListener("click", () => input.click());
      input.addEventListener("change", () => {
        const [file] = input.files;
        if (!file) return;
        if (state.selectedImageUrl) URL.revokeObjectURL(state.selectedImageUrl);
        state.selectedImageUrl = URL.createObjectURL(file);
        state.selectedFileName = file.name;
        render();
        showToast("截图已在本地载入");
      });
      document.getElementById("use-sample").addEventListener("click", startAnalysis);
      document.getElementById("source-link").addEventListener("keydown", (event) => {
        if (event.key === "Enter") startAnalysis();
      });
    }

    function bindDrawEvents() {
      document.getElementById("close-draw").addEventListener("click", () => {
        state.screen = "home";
        state.revealed = false;
        state.revealProgress = 0;
        render();
      });

      if (state.revealed) {
        app.querySelectorAll("[data-assessment]").forEach((button) => {
          button.addEventListener("click", () => assess(button.dataset.assessment));
        });
        return;
      }

      const directReveal = document.getElementById("direct-reveal");
      if (directReveal) directReveal.addEventListener("click", reveal);
      const mask = document.getElementById("semantic-mask");
      if (mask) {
        let dragging = false;
        let startX = 0;
        mask.addEventListener("click", reveal);
        mask.addEventListener("pointerdown", (event) => {
          dragging = true;
          startX = event.clientX;
          mask.setPointerCapture(event.pointerId);
        });
        mask.addEventListener("pointermove", (event) => {
          if (!dragging) return;
          updateRevealProgress(Math.abs(event.clientX - startX) / Math.max(1, mask.clientWidth));
          if (state.revealProgress >= 0.45) reveal();
        });
        mask.addEventListener("pointerup", () => { dragging = false; });
        mask.addEventListener("pointercancel", () => { dragging = false; });
        mask.addEventListener("keydown", (event) => {
          if (event.key.startsWith("Arrow")) {
            event.preventDefault();
            updateRevealProgress(state.revealProgress + 0.15);
            if (state.revealProgress >= 0.45) reveal();
          }
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            reveal();
          }
        });
      }

      app.querySelectorAll("[data-variant-answer]").forEach((button) => {
        button.addEventListener("click", () => answerVariant(button.dataset.variantAnswer));
      });
    }

    function bindCompleteEvents() {
      document.getElementById("draw-again").addEventListener("click", () => {
        const hasNext = state.drawMode === "continuous" && state.sessionPosition + 1 < state.continuousLimit;
        if (hasNext) {
          state.sessionPosition += 1;
          state.currentCard = state.sessionCards[state.sessionPosition];
          startDraw("continuous", false);
          return;
        }
        const poolCards = memoryPools[state.selectedPool].cardIndexes;
        const currentPoolPosition = Math.max(0, poolCards.indexOf(state.currentCard));
        state.currentCard = poolCards[(currentPoolPosition + 1) % poolCards.length];
        startDraw("single", false);
      });
      document.getElementById("back-home").addEventListener("click", () => navigate("home"));
    }

    function navigate(target) {
      if (["home", "library", "profile", "upload"].includes(target)) {
        clearTimeout(state.summonTimer);
        state.screen = target;
        state.revealed = false;
        state.revealProgress = 0;
        render();
        return;
      }
    }

    function startAnalysis() {
      const link = document.getElementById("source-link");
      if (!state.selectedImageUrl && link && link.value.trim()) {
        state.selectedFileName = "来自链接的内容";
      }
      state.screen = "analyzing";
      render();
      const status = document.getElementById("analysis-status");
      const updates = [
        [500, "定位标题、字幕与关键证据…"],
        [1050, "正在生成一张记忆卡…"]
      ];
      updates.forEach(([delay, text]) => {
        setTimeout(() => {
          if (state.screen === "analyzing" && status) status.textContent = text;
        }, delay);
      });
      clearTimeout(state.analysisTimer);
      state.analysisTimer = setTimeout(() => {
        state.cardCount += 1;
        state.currentCard = 0;
        state.selectedPool = "due";
        startDraw("single");
      }, 1650);
    }

    function startDraw(mode, resetIndex = true) {
      clearTimeout(state.summonTimer);
      state.drawMode = mode;
      const poolCards = memoryPools[state.selectedPool].cardIndexes;
      state.sessionCards = mode === "continuous" ? [...poolCards].slice(0, 10) : [poolCards[0]];
      state.continuousLimit = state.sessionCards.length;
      if (resetIndex) {
        state.sessionPosition = 0;
        state.currentCard = state.sessionCards[0];
      }
      state.revealed = false;
      state.revealProgress = 0;
      state.variantResult = "";
      state.screen = "summon";
      render();
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      state.summonTimer = setTimeout(finishSummon, reduceMotion ? 20 : 1450);
    }

    function finishSummon() {
      if (state.screen !== "summon") return;
      clearTimeout(state.summonTimer);
      state.screen = "draw";
      render();
    }

    function updateRevealProgress(progress) {
      state.revealProgress = Math.min(1, Math.max(0, progress));
      const mask = document.getElementById("semantic-mask");
      const label = document.getElementById("reveal-label");
      if (!mask || !label) return;
      mask.style.opacity = String(Math.max(.22, 1 - state.revealProgress * .75));
      label.textContent = state.revealProgress >= 0.45 ? "正在完整揭示" : `已擦开 ${Math.round(state.revealProgress * 100)}%`;
    }

    function reveal() {
      state.revealed = true;
      state.revealProgress = 1;
      render();
      requestAnimationFrame(() => document.getElementById("answer")?.scrollIntoView({ behavior: "smooth", block: "nearest" }));
    }

    function answerVariant(rawAnswer) {
      const card = cards[state.currentCard];
      const isJudgment = state.currentCard % 2 === 0;
      const correct = isJudgment
        ? (rawAnswer === "true") === card.judgment.correct
        : Number(rawAnswer) === card.choice.correct;
      state.variantResult = correct ? "回答正确 · 现在检查证据" : "这次没有答对 · 不扣分，只会更早复习";
      reveal();
    }

    function assess(value) {
      state.lastAssessment = value;
      state.masteryBefore = state.masteryByCard[state.currentCard];
      state.masteryAfter = nextMastery(state.masteryBefore, value);
      state.masteryByCard[state.currentCard] = state.masteryAfter;
      state.nextReviewByCard[state.currentCard] = value === "forgot" ? 1 : value === "fuzzy" ? 2 : 4;
      state.screen = "complete";
      render();
    }

    function nextMastery(current, assessment) {
      if (current === "sealed") return "awakened";
      if (assessment !== "remembered") return current;
      if (current === "awakened") return "solidified";
      if (current === "solidified") return "engraved";
      return "engraved";
    }

    function showToast(message) {
      clearTimeout(state.toastTimer);
      app.querySelector(".toast")?.remove();
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.setAttribute("role", "status");
      toast.textContent = message;
      app.appendChild(toast);
      state.toastTimer = setTimeout(() => toast.remove(), 1800);
    }

    function resetExperience() {
      clearTimeout(state.analysisTimer);
      clearTimeout(state.summonTimer);
      if (state.selectedImageUrl) URL.revokeObjectURL(state.selectedImageUrl);
      Object.assign(state, {
        screen: "home",
        selectedImageUrl: "",
        selectedFileName: "",
        selectedPool: "due",
        currentCard: 0,
        drawMode: "single",
        continuousLimit: 1,
        sessionCards: [0],
        sessionPosition: 0,
        revealed: false,
        revealProgress: 0,
        lastAssessment: "",
        masteryByCard: ["sealed", "awakened", "awakened"],
        nextReviewByCard: [0, 2, 1],
        variantResult: "",
        mascotTapCount: 0,
        masteryBefore: "sealed",
        masteryAfter: "sealed",
        cardCount: 5
      });
      render();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("desktop-reset").addEventListener("click", resetExperience);
    render();
  </script>
</body>
</html>
