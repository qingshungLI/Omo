<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E8EBBD">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2398A84E'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-size='34' font-weight='700' fill='%23FDFAF2'%3ER%3C/text%3E%3C/svg%3E">
  <title>Recallo · iOS 交互预览</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #98A84E;
      --primary-action: #A5AE66;
      --page: #E8EBBD;
      --cream: #FDFAF2;
      --nav: #FCF8ED;
      --text: #44423D;
      --text-2: #676767;
      --muted: #8C8B82;
      --border: #E0E5BA;
      --upload: #E8E9C2;
      --wrong: #FD9789;
      --blue: #94D0E9;
      --desktop: #F3F2EA;
      --shadow: 0 18px 54px rgba(74, 78, 48, 0.16);
      --soft-shadow: 0 4px 10px rgba(152, 163, 94, 0.2);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
        "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--desktop);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(79, 135, 185, 0.58);
      outline-offset: 3px;
    }

    .preview-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 380px) minmax(390px, 520px);
      place-content: center;
      align-items: center;
      gap: clamp(32px, 6vw, 96px);
      padding: 24px;
    }

    .preview-copy {
      max-width: 360px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      font-size: 17px;
      font-weight: 700;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: var(--cream);
      background: var(--primary);
      box-shadow: var(--soft-shadow);
    }

    .preview-copy h1 {
      margin: 0;
      max-width: 350px;
      font-size: clamp(34px, 4vw, 52px);
      line-height: 1.08;
      letter-spacing: -0.045em;
    }

    .preview-copy > p {
      margin: 20px 0 0;
      color: var(--text-2);
      font-size: 16px;
      line-height: 1.75;
    }

    .steps {
      display: grid;
      gap: 14px;
      margin: 34px 0;
      padding: 0;
      list-style: none;
    }

    .steps li {
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: start;
      gap: 11px;
      color: var(--text-2);
      font-size: 14px;
      line-height: 1.55;
    }

    .step-number {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(152, 168, 78, 0.45);
      border-radius: 9px;
      color: var(--primary);
      background: rgba(253, 250, 242, 0.72);
      font-size: 12px;
      font-weight: 700;
    }

    .preview-note {
      padding: 14px 16px;
      border-left: 3px solid var(--primary);
      background: rgba(253, 250, 242, 0.7);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .reset-button {
      margin-top: 18px;
      padding: 0;
      border: 0;
      border-bottom: 1px solid currentColor;
      color: var(--text-2);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
    }

    .device {
      position: relative;
      width: 414px;
      height: min(884px, calc(100vh - 36px));
      min-height: 700px;
      justify-self: center;
      overflow: hidden;
      border: 10px solid #292A27;
      border-radius: 52px;
      background: var(--page);
      box-shadow: var(--shadow), 0 0 0 1px rgba(0, 0, 0, 0.12);
    }

    .device::before {
      content: "";
      position: absolute;
      z-index: 80;
      top: 10px;
      left: 50%;
      width: 92px;
      height: 25px;
      border-radius: 18px;
      background: #292A27;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--page);
    }

    .status-bar {
      position: absolute;
      z-index: 70;
      top: 0;
      left: 0;
      right: 0;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 23px 0;
      color: #292A27;
      font-size: 12px;
      font-weight: 700;
      pointer-events: none;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .signal {
      width: 15px;
      height: 10px;
      border-bottom: 3px solid currentColor;
      border-left: 3px solid transparent;
      border-right: 3px solid transparent;
    }

    .battery {
      width: 20px;
      height: 10px;
      border: 1.5px solid currentColor;
      border-radius: 3px;
      position: relative;
    }

    .battery::before {
      content: "";
      position: absolute;
      inset: 1.5px;
      border-radius: 1px;
      background: currentColor;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 2px;
      width: 1.5px;
      height: 4px;
      border-radius: 1px;
      background: currentColor;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding-top: 46px;
      overflow: hidden;
      background: var(--page);
      animation: screen-in 240ms ease-out;
    }

    @keyframes screen-in {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .top-chrome {
      z-index: 4;
      height: 60px;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .circle-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--cream);
      color: var(--text);
      box-shadow: var(--soft-shadow);
      cursor: pointer;
    }

    .circle-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .top-title {
      font-size: 18px;
      font-weight: 650;
      color: #575757;
    }

    .screen-scroll {
      position: relative;
      z-index: 2;
      min-height: 0;
      flex: 1;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }

    .screen-scroll::-webkit-scrollbar {
      display: none;
    }

    .home-content {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 24px 126px;
      text-align: center;
    }

    .home-content h2 {
      margin: 0;
      font-size: 25px;
      line-height: 1.25;
      letter-spacing: -0.025em;
    }

    .home-subtitle {
      margin: 9px 0 0;
      color: rgba(103, 103, 103, 0.76);
      font-size: 14px;
    }

    .memory-pools {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin: auto 0 24px;
    }

    .memory-pool {
      position: relative;
      min-height: 226px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 17px 8px;
      border: 1px solid rgba(152, 168, 78, 0.24);
      border-radius: 19px;
      color: var(--text);
      background: rgba(253, 250, 242, 0.7);
      box-shadow: 0 4px 12px rgba(112, 120, 62, 0.08);
      cursor: pointer;
      transition: transform 320ms cubic-bezier(.34,1.56,.64,1), border-color 180ms ease, background 180ms ease, box-shadow 260ms ease;
    }

    .memory-pool:hover { border-color: rgba(152, 168, 78, 0.7); }
    .memory-pool:active { transform: scale(.97); }
    .memory-pool.selected {
      border-color: var(--primary);
      background: var(--cream);
      box-shadow: 0 7px 20px rgba(112, 120, 62, 0.18);
      transform: translateY(-5px) rotate(-5deg);
    }

    .memory-pool.selected::after {
      content: "";
      position: absolute;
      inset: 4px;
      z-index: -1;
      border: 1px solid rgba(152, 168, 78, 0.2);
      border-radius: 16px;
      background: rgba(253, 250, 242, 0.4);
      transform: translateY(3px) rotate(2deg);
      pointer-events: none;
    }

    .pool-symbol {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(152, 168, 78, 0.28);
      border-radius: 14px;
      color: var(--primary);
      background: rgba(232, 235, 189, 0.42);
      font-size: 20px;
    }

    .pool-title {
      font-size: 14px;
      font-weight: 750;
      line-height: 1.25;
    }

    .pool-copy {
      min-height: 32px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.45;
    }

    .pool-count {
      color: var(--primary);
      font-size: 11px;
      font-weight: 750;
    }

    .card-stack {
      position: relative;
      width: 178px;
      height: 126px;
      margin: 18px 0 20px;
      border: 0;
      background: transparent;
      cursor: grab;
      touch-action: none;
      transition: transform 200ms cubic-bezier(.34,1.56,.64,1);
    }

    .card-stack:active { cursor: grabbing; }

    .stack-card {
      position: absolute;
      top: 8px;
      left: 22px;
      width: 134px;
      height: 98px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(253, 250, 242, 0.84);
      box-shadow: var(--soft-shadow);
    }

    .stack-card:nth-child(1) {
      opacity: 0.72;
      transform: translate(-18px, 13px) rotate(-7deg);
    }

    .stack-card:nth-child(2) {
      opacity: 0.84;
      transform: translate(19px, 7px) rotate(6deg);
    }

    .stack-card.front {
      display: grid;
      place-items: center;
      opacity: 1;
      transform: none;
    }

    .stack-card-content {
      display: grid;
      justify-items: center;
      gap: 4px;
    }

    .sparkle {
      width: 30px;
      height: 30px;
      color: var(--primary);
    }

    .stack-title {
      font-size: 13px;
      font-weight: 700;
    }

    .stack-subtitle {
      color: var(--muted);
      font-size: 11px;
    }

    .button-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .primary-button,
    .secondary-button {
      min-height: 53px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 650;
    }

    .primary-button {
      border: 1px solid var(--primary-action);
      background: var(--primary-action);
      color: #fffef6;
      box-shadow: 0 3px 7px rgba(125, 136, 61, 0.18);
    }

    .secondary-button {
      border: 1px solid var(--primary);
      background: var(--cream);
      color: var(--primary);
    }

    .helper-copy {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .bottom-nav {
      position: absolute;
      z-index: 30;
      right: 18px;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 18px;
      height: 86px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      padding: 0 7px;
      border-radius: 29px;
      background: var(--nav);
      box-shadow: var(--soft-shadow);
    }

    .nav-button {
      height: 62px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 1px;
      padding: 0;
      border: 0;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
    }

    .nav-button img {
      width: 32px;
      height: 32px;
    }

    .nav-button.active {
      color: var(--primary);
    }

    .nav-button img { opacity: .72; }
    .nav-button.active img { opacity: 1; filter: sepia(.2) saturate(1.3); }

    .upload-content {
      position: relative;
      min-height: 100%;
      padding: 15px 24px 126px;
    }

    .upload-lead {
      position: relative;
      min-height: 192px;
      padding-top: 18px;
      text-align: center;
    }

    .upload-lead h2 {
      max-width: 290px;
      margin: 0 auto;
      font-size: 23px;
      line-height: 1.34;
      letter-spacing: -0.02em;
    }

    .upload-lead p {
      margin: 9px auto 0;
      color: var(--text-2);
      font-size: 13px;
      line-height: 1.55;
    }

    .mascot {
      position: relative;
      width: 112px;
      height: 112px;
      margin: 13px auto 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .mascot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 220ms cubic-bezier(.34,1.56,.64,1);
    }

    .mascot.boop img { animation: mascot-boop 340ms cubic-bezier(.34,1.56,.64,1); }
    .mascot.success img { animation: mascot-hop 480ms cubic-bezier(.34,1.56,.64,1) 1; }

    @keyframes mascot-boop {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.12, .84); }
      68% { transform: scale(.94, 1.08); }
    }

    @keyframes mascot-hop {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-10px) scale(.96, 1.04); }
    }

    .mascot-hint {
      min-height: 20px;
      margin: 2px 0 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .upload-card {
      position: relative;
      z-index: 3;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--cream);
      box-shadow: var(--soft-shadow);
    }

    .upload-card h3 {
      margin: 0;
      font-size: 16px;
    }

    .upload-card > p {
      margin: 6px 0 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .upload-action {
      width: 100%;
      min-height: 53px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fffdf7;
      color: var(--text);
      cursor: pointer;
      font-weight: 650;
    }

    .upload-action + .upload-action {
      margin-top: 10px;
    }

    .upload-action.primary {
      border-color: var(--primary-action);
      color: #fffef6;
      background: var(--primary-action);
    }

    .upload-action svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .selected-preview {
      display: grid;
      grid-template-columns: 58px 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fffdf7;
    }

    .selected-preview img {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      object-fit: cover;
    }

    .selected-preview strong,
    .selected-preview span {
      display: block;
    }

    .selected-preview strong {
      font-size: 13px;
    }

    .selected-preview span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin: 16px 0;
      color: var(--muted);
      font-size: 11px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: var(--border);
    }

    .link-input {
      width: 100%;
      height: 47px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fffdf7;
      color: var(--text);
      font-size: 13px;
    }

    .privacy-copy {
      margin: 13px 3px 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.55;
      text-align: center;
    }

    .bg-deco {
      position: absolute;
      z-index: 1;
      opacity: 0.6;
      pointer-events: none;
    }

    .bg-deco.left {
      left: -4px;
      bottom: 93px;
      width: 114px;
    }

    .bg-deco.right {
      right: -3px;
      bottom: 90px;
      width: 105px;
    }

    .analyzing {
      min-height: 100%;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 24px;
      text-align: center;
    }

    .scan-card {
      position: relative;
      width: 238px;
      height: 318px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--cream);
      box-shadow: var(--soft-shadow);
    }

    .scan-card::after {
      content: "";
      position: absolute;
      right: 18px;
      left: 18px;
      height: 2px;
      background: var(--primary);
      box-shadow: 0 0 12px rgba(152, 168, 78, 0.55);
      animation: scanning 1.35s ease-in-out infinite;
    }

    @keyframes scanning {
      0%, 100% { top: 40px; }
      50% { top: 272px; }
    }

    .scan-core {
      display: grid;
      justify-items: center;
      gap: 14px;
      color: var(--primary);
    }

    .scan-core svg {
      width: 42px;
      height: 42px;
    }

    .analyzing h2 {
      margin: 27px 0 8px;
      font-size: 21px;
    }

    .analyzing p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .flow-top {
      height: 68px;
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      flex: 0 0 auto;
      padding: 4px 24px 12px;
    }

    .flow-top .top-title {
      text-align: center;
    }

    .summon-stage {
      position: relative;
      min-height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 42px 24px 72px;
      text-align: center;
    }

    .summon-copy {
      position: absolute;
      z-index: 5;
      top: 40px;
      left: 24px;
      right: 24px;
    }

    .summon-copy p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .summon-copy h2 {
      margin: 0;
      font-size: 22px;
    }

    .summon-stack {
      position: relative;
      width: 240px;
      height: 330px;
    }

    .summon-shadow-card,
    .summoned-card {
      position: absolute;
      inset: 0;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: var(--cream);
      box-shadow: var(--soft-shadow);
    }

    .summon-shadow-card:nth-child(1) {
      opacity: 0.5;
      transform: translate(-16px, 17px) rotate(-6deg);
    }

    .summon-shadow-card:nth-child(2) {
      opacity: 0.72;
      transform: translate(18px, 12px) rotate(5deg);
    }

    .summoned-card {
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 28px;
      animation: summon-card 1250ms cubic-bezier(.2,.8,.2,1) both;
    }

    .summoned-card::before {
      content: "";
      position: absolute;
      inset: -20px;
      border-radius: 40px;
      opacity: 0;
      animation: summon-glow 1250ms ease-out both;
      pointer-events: none;
    }

    .summoned-card.r::before {
      background: radial-gradient(circle, rgba(103, 103, 103, 0.08) 0%, transparent 70%);
    }

    .summoned-card.sr::before {
      background: radial-gradient(circle, rgba(240, 138, 93, 0.12) 0%, transparent 70%);
    }

    .summoned-card.ssr::before {
      background: radial-gradient(circle, rgba(217, 164, 65, 0.14) 0%, transparent 70%);
    }

    .summoned-card .rarity,
    .summoned-card .mastery-chip {
      position: absolute;
      top: 18px;
      left: 18px;
      animation: summon-badge 200ms ease-out 1250ms both;
    }

    .summoned-card .mastery-chip {
      right: 18px;
      left: auto;
    }

    .summoned-card strong {
      font-size: 21px;
      line-height: 1.35;
    }

    .summoned-card span:last-child {
      color: var(--muted);
      font-size: 12px;
    }

    .summon-trail {
      position: absolute;
      z-index: 2;
      width: 330px;
      height: 10px;
      top: 44%;
      left: 43%;
      border-radius: 999px;
      background: rgba(79, 135, 185, 0.34);
      box-shadow: 0 0 24px rgba(79, 135, 185, 0.55);
      transform: rotate(-24deg);
      animation: summon-trail 500ms ease-out 250ms both;
    }

    .summon-trail.r { background: rgba(103, 103, 103, 0.26); }
    .summon-trail.sr {

    function libraryScreen() {
      const rows = cards.map((card, index) => `
        <article class="collection-card">
          <span class="rarity ${card.rarity.toLowerCase()}">${card.rarity}</span>
          <div>
            <h3>${card.coreBefore}${card.hidden}${card.coreAfter}</h3>
            <p>${card.source}</p>
            <p>${masteryLabels[state.masteryByCard[index]]} · ${reviewDateText(state.nextReviewByCard[index])}复习</p>
          </div>
        </article>
      `).join("");
      return `
        ${statusBar()}
        <section class="screen" data-screen="library">
          ${topChrome("知识库")}
          <div class="screen-scroll">
            <div class="collection-content">
              <h2>你的记忆卡</h2>
              <div class="collection-list">${rows}</div>
              <p class="helper-copy">这里只展示真实卡片；完整知识图谱不在本轮伪造。</p>
            </div>
          </div>
          ${bottomNav()}
        </section>
      `;
    }

    function profileScreen() {
      const remembered = state.masteryByCard.filter((item) => item === "solidified" || item === "engraved").length;
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      return `
        ${statusBar()}
        <section class="screen" data-screen="profile">
          ${topChrome("我的")}
          <div class="screen-scroll">
            <div class="profile-content">
              <h2>我的 Recallo</h2>
              <div class="profile-stats">
                <div class="profile-stat"><strong>${cards.length}</strong><span>真实卡片</span></div>
                <div class="profile-stat"><strong>${remembered}</strong><span>已稳固</span></div>
                <div class="profile-stat"><strong>${state.mascotTapCount}</strong><span>毛球回应</span></div>
              </div>
              <div class="profile-panel">
                <strong>稀有度解释</strong>
                <p>R / SR / SSR 表示知识节点的核心潜力，不是抽取概率，也不等于掌握程度。</p>
              </div>
              <div class="profile-panel" style="margin-top:12px">
                <strong>动态效果</strong>
                <p>系统 Reduce Motion：${reduced ? "已开启，过场改为淡入" : "未开启，使用克制的 1450ms 召回过场"}。</p>
              </div>
              <div class="profile-panel" style="margin-top:12px">
                <strong>数据与隐私</strong>
                <p>本 Web 预览只在浏览器本地读取选择的图片，不上传文件。</p>
              </div>
            </div>
          </div>
          ${bottomNav()}
        </section>
      `;
    }

    function summonScreen() {
      const card = cards[state.currentCard];
      const pool = memoryPools[state.selectedPool];
      return `
        ${statusBar()}
        <section class="screen" data-screen="summon">
          <div class="summon-stage">
            <div class="summon-copy">
              <p>${pool.title}</p>
              <h2>正在从你的过去召回</h2>
            </div>
            <div class="summon-stack" aria-label="正在召回一张 ${card.rarity} 记忆卡">
              <div class="summon-shadow-card"></div>
              <div class="summon-shadow-card"></div>
              <div class="summon-trail ${card.rarity.toLowerCase()}"></div>
              <div class="summoned-card ${card.rarity.toLowerCase()}">
                <span class="rarity ${card.rarity.toLowerCase()}">${card.rarity}</span>
                <span class="mastery-chip">${masteryLabels[state.masteryByCard[state.currentCard]]}</span>
                ${icons.sparkle}
                <strong>一段记忆正在苏醒</strong>
              </div>
            </div>
            <button class="skip-summon" id="skip-summon" type="button">跳过过场</button>
          </div>
        </section>
      `;
    }

    function drawScreen() {
      const card = cards[state.currentCard];
      const taskKind = state.masteryByCard[state.currentCard] === "sealed"
        ? "masked_semantic"
        : (state.currentCard % 2 === 0 ? "judgment" : "choice");
      const progressText = state.drawMode === "continuous"
        ? `${state.sessionPosition + 1} / ${state.continuousLimit}`
        : "唤醒一张记忆";
      const revealedAnswer = `<div class="answer" id="answer">
            ${state.variantResult ? `<p class="variant-result">${state.variantResult}</p>` : ""}
            <strong>${card.answer}</strong>
            <p>${card.explanation}</p>
            <p class="rarity-reason">${card.rarityReason}</p>
            ${sourcePreview(card)}
            <button class="source-link" data-toast="演示页不跳转外部平台" type="button">↗ ${card.source}</button>
          </div>`;
      let task;
      if (state.revealed) {
        task = revealedAnswer;
      } else if (taskKind === "masked_semantic") {
        task = `<div class="reveal-area">
            <p class="semantic-sentence">
              ${card.coreBefore}<span class="semantic-mask" id="semantic-mask" role="button" tabindex="0" aria-label="擦开或点击揭示承重语义">${card.hidden}</span>${card.coreAfter}
            </p>
            <p class="reveal-hint" id="reveal-label">在遮挡区域擦动；覆盖 45% 后完整揭示</p>
          </div>`;
      } else if (taskKind === "judgment") {
        task = `<div class="variant-options" aria-label="判断题">
            <p class="semantic-sentence">${card.judgment.statement}</p>
            <button class="variant-option" data-variant-answer="true" type="button">对</button>
            <button class="variant-option" data-variant-answer="false" type="button">不对</button>
          </div>`;
      } else {
        task = `<div class="variant-options" aria-label="选择题">
            <p class="semantic-sentence">${card.choice.prompt}</p>
            ${card.choice.options.map((option, index) => `<button class="variant-option" data-variant-answer="${index}" type="button">${option}</button>`).join("")}
          </div>`;
      }
      const assessment = state.revealed
        ? `<div class="assessment">
            <p>刚才想起来了吗？</p>
            <div class="assessment-buttons">
              <button class="assessment-button remembered" data-assessment="remembered" type="button">记得</button>
              <button class="assessment-button fuzzy" data-assessment="fuzzy" type="button">模糊</button>
              <button class="assessment-button forgot" data-assessment="forgot" type="button">忘记</button>
            </div>
          </div>`
        : (taskKind === "masked_semantic" ? `<button class="direct-reveal" id="direct-reveal" type="button">直接揭示</button>` : "");

      return `
        ${statusBar()}
        <section class="screen" data-screen="draw">
          ${state.drawMode === "continuous" ? `<div class="session-progress" style="width: ${((state.sessionPosition + 1) / state.continuousLimit) * 100}%"></div>` : ""}
          <header class="flow-top">
            <button class="circle-button" id="close-draw" type="button" aria-label="退出召回">${icons.close}</button>
            <div class="top-title">${progressText}</div>
            <span></span>
          </header>
          <div class="screen-scroll">
            <div class="draw-content">
              <article class="memory-card">
                <div class="card-meta">
                  <span class="rarity ${card.rarity.toLowerCase()}">${card.rarity}</span>
                  <span class="mastery-chip">${masteryLabels[state.masteryByCard[state.currentCard]]}</span>
                  <span class="source-status">${icons.seal}演示来源已关联</span>
                </div>
                <p class="prompt-label">${taskKind === "masked_semantic" ? "先在脑中补全承重语义" : "后续复习变式"}</p>
                <h2 class="recall-cue">${card.cue}</h2>
                ${task}
              </article>
              ${assessment}
            </div>
          </div>
        </section>
      `;
    }

    function completeScreen() {
      const card = cards[state.currentCard];
      const transition = `${masteryLabels[state.masteryBefore]} → ${masteryLabels[state.masteryAfter]}`;
      const detail = state.lastAssessment === "remembered"
        ? "你完成了一次主动重建。它会在新的时间窗口再次出现。"
        : "记忆没有被惩罚或摧毁，系统只会让它更早再次出现。";
      const masteryOrder = ["sealed", "awakened", "solidified", "engraved"];
      const activeIndex = masteryOrder.indexOf(state.masteryAfter);
      const masteryTrack = masteryOrder.map((stage, index) =>
        `<span class="mastery-step ${index <= activeIndex ? "active" : ""}">${masteryLabels[stage]}</span>`
      ).join("");
      const hasNext = state.drawMode === "continuous" && state.sessionPosition + 1 < state.continuousLimit;
      const assessmentClass = state.lastAssessment ? `assessment-${state.lastAssessment}` : "";
      let mascotTransform = "";
      if (state.lastAssessment === "fuzzy") mascotTransform = ' style="transform: rotate(-5deg)"';
      else if (state.lastAssessment === "forgot") mascotTransform = ' style="transform: translateY(3px)"';
      return `
        ${statusBar()}
        <section class="screen" data-screen="complete">
          <div class="screen-scroll">
            <div class="complete-content">
              <div class="mascot ${state.lastAssessment === "remembered" ? "success" : ""}" aria-hidden="true">
                <img src="app-demo-assets/mascot-v06/${state.lastAssessment === "remembered" ? "recallo-mascot-success.png" : "recallo-mascot-tilt.png"}" alt=""${mascotTransform}>
              </div>
              <div class="archive-card complete-card ${assessmentClass}">
                <div class="archive-thumb">${memoryPools[state.selectedPool].symbol}</div>
                <div>
                  <span class="rarity ${card.rarity.toLowerCase()}">${card.rarity}</span>
                  <h3>${card.answer}</h3>
                  <p>${card.source} · 已收入个人收藏</p>
                </div>
              </div>
              <h2>记忆已修复并入册</h2>
              <p>${detail}</p>
              <div class="memory-change">
                <div class="mastery-track">${masteryTrack}</div>
                <p class="helper-copy">${transition} · ${reviewDateText(state.nextReviewByCard[state.currentCard])}再次召回</p>
              </div>
              <div class="complete-actions">
                <button class="primary-button" id="draw-again" type="button">${hasNext ? "继续召回" : "再召回一张"}</button>
                <button class="secondary-button" id="back-home" type="button">回到首页</button>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function render() {
      clearTimeout(state.toastTimer);
      const screens = {
        home: homeScreen,
        library: libraryScreen,
        profile: profileScreen,
        upload: uploadScreen,
        analyzing: analyzingScreen,
        summon: summonScreen,
        draw: drawScreen,
        complete: completeScreen
      };
      app.innerHTML = screens[state.screen]();
      bindCommonEvents();
      if (state.screen === "home") bindHomeEvents();
      if (state.screen === "upload") bindUploadEvents();
      if (state.screen === "summon") bindSummonEvents();
      if (state.screen === "draw") bindDrawEvents();
      if (state.screen === "complete") bindCompleteEvents();
    }

    function bindCommonEvents() {
      app.querySelectorAll("[data-nav]").forEach((button) => {
        button.addEventListener("click", () => navigate(button.dataset.nav));
      });
      app.querySelectorAll("[data-toast]").forEach((button) => {
        button.addEventListener("click", () => showToast(button.dataset.toast));
      });
    }

    function bindHomeEvents() {
      const hints = [
        "它只提醒你：抽到的是自己的过去",
        "先想一遍，再看答案",
        "忘记不会受罚，只会更早再见"
      ];
      app.querySelectorAll("[data-pool]").forEach((button) => {
        button.addEventListener("click", () => {
          const key = button.dataset.pool;
          state.selectedPool = key;
          render();
          const poolKeys = Object.keys(memoryPools);
          const poolIndex = poolKeys.indexOf(key);
          const leanAngle = (poolIndex - 1) * 4;
          const mascotImg = document.querySelector(".mascot img");
          const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (mascotImg) mascotImg.style.transform = reduced ? "" : `rotate(${leanAngle}deg)`;
        });
      });
      document.getElementById("draw-one").addEventListener("click", () => startDraw("single"));
      document.getElementById("draw-many").addEventListener("click", () => startDraw("continuous"));
      const mascot = document.getElementById("mascot-button");
      mascot.addEventListener("click", () => {
        state.mascotTapCount += 1;
        mascot.classList.remove("boop");
        void mascot.offsetWidth;
        mascot.classList.add("boop");
        document.getElementById("mascot-hint").textContent = hints[state.mascotTapCount % hints.length];
        setTimeout(() => mascot.classList.remove("boop"), 340);
      });

      const stack = document.getElementById("recall-stack");
      let startY = 0;
      let startX = 0;
      let dragging = false;
      let triggered = false;
      let holdTimer;
      const resetStack = () => {
        stack.style.transform = "";
        dragging = false;
        clearTimeout(holdTimer);
      };
      stack.addEventListener("pointerdown", (event) => {
        dragging = true;
        triggered = false;
        startY = event.clientY;
        startX = event.clientX;
        stack.setPointerCapture(event.pointerId);
        holdTimer = setTimeout(() => {
          triggered = true;
          startDraw("single");
        }, 450);
      });
      stack.addEventListener("pointermove", (event) => {
        if (!dragging || triggered) return;
        const dy = Math.min(0, event.clientY - startY);
        const dx = event.clientX - startX;
        if (Math.abs(dy) > 6 || Math.abs(dx) > 6) clearTimeout(holdTimer);
        const tilt = Math.max(-4, Math.min(4, dx / 12));
        stack.style.transform = `translateY(${Math.max(-36, dy)}px) rotate(${tilt}deg) scale(${dy <= -28 ? .97 : 1})`;
      });
      const endGesture = (event) => {
        if (!dragging || triggered) return;
        const dy = event.clientY - startY;
        resetStack();
        if (dy <= -28) startDraw("single");
      };
      stack.addEventListener("pointerup", endGesture);
      stack.addEventListener("pointercancel", resetStack);
      stack.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          startDraw("single");
        }
      });
    }

    function bindSummonEvents() {
      document.getElementById("skip-summon").addEventListener("click", finishSummon);
    }

    function bindUploadEvents() {
      const input = document.getElementById("image-input");
      document.getElementById("choose-image").addEventListener("click", () => input.click());
      input.addEventListener("change", () => {
        const [file] = input.files;
        if (!file) return;
        if (state.selectedImageUrl) URL.revokeObjectURL(state.selectedImageUrl);
        state.selectedImageUrl = URL.createObjectURL(file);
        state.selectedFileName = file.name;
        render();
        showToast("截图已在本地载入");
      });
      document.getElementById("use-sample").addEventListener("click", startAnalysis);
      document.getElementById("source-link").addEventListener("keydown", (event) => {
        if (event.key === "Enter") startAnalysis();
      });
    }

    function bindDrawEvents() {
      document.getElementById("close-draw").addEventListener("click", () => {
        state.screen = "home";
        state.revealed = false;
        state.revealProgress = 0;
        render();
      });

      if (state.revealed) {
        app.querySelectorAll("[data-assessment]").forEach((button) => {
          button.addEventListener("click", () => assess(button.dataset.assessment));
        });
        return;
      }

      const directReveal = document.getElementById("direct-reveal");
      if (directReveal) directReveal.addEventListener("click", reveal);
      const mask = document.getElementById("semantic-mask");
      if (mask) {
        let dragging = false;
        let startX = 0;
        mask.addEventListener("click", reveal);
        mask.addEventListener("pointerdown", (event) => {
          dragging = true;
          startX = event.clientX;
          mask.setPointerCapture(event.pointerId);
        });
        mask.addEventListener("pointermove", (event) => {
          if (!dragging) return;
          const oldProgress = state.revealProgress;
          updateRevealProgress(Math.abs(event.clientX - startX) / Math.max(1, mask.clientWidth));
          mask.style.transform = `scaleY(${1 + state.revealProgress * 0.015})`;
          if (oldProgress < 0.25 && state.revealProgress >= 0.25) {
            mask.style.outline = "2px solid rgba(152, 168, 78, 0.4)";
            setTimeout(() => {
              mask.style.outline = "";
            }, 150);
          }
          if (oldProgress < 0.5 && state.revealProgress >= 0.5) {
            mask.style.outline = "2px solid rgba(152, 168, 78, 0.6)";
            setTimeout(() => {
              mask.style.outline = "";
            }, 150);
          }
          if (state.revealProgress >= 0.45) reveal();
        });
        mask.addEventListener("pointerup", () => {
          dragging = false;
          mask.style.transform = "";
        });
        mask.addEventListener("pointercancel", () => {
          dragging = false;
          mask.style.transform = "";
        });
        mask.addEventListener("keydown", (event) => {
          if (event.key.startsWith("Arrow")) {
            event.preventDefault();
            updateRevealProgress(state.revealProgress + 0.15);
            if (state.revealProgress >= 0.45) reveal();
          }
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            reveal();
          }
        });
      }

      app.querySelectorAll("[data-variant-answer]").forEach((button) => {
        button.addEventListener("click", () => answerVariant(button.dataset.variantAnswer));
      });
    }

    function bindCompleteEvents() {
      document.getElementById("draw-again").addEventListener("click", () => {
        const hasNext = state.drawMode === "continuous" && state.sessionPosition + 1 < state.continuousLimit;
        if (hasNext) {
          state.sessionPosition += 1;
          state.currentCard = state.sessionCards[state.sessionPosition];
          startDraw("continuous", false);
          return;
        }
        const poolCards = memoryPools[state.selectedPool].cardIndexes;
        const currentPoolPosition = Math.max(0, poolCards.indexOf(state.currentCard));
        state.currentCard = poolCards[(currentPoolPosition + 1) % poolCards.length];
        startDraw("single", false);
      });
      document.getElementById("back-home").addEventListener("click", () => navigate("home"));
    }

    function navigate(target) {
      if (["home", "library", "profile", "upload"].includes(target)) {
        clearTimeout(state.summonTimer);
        state.screen = target;
        state.revealed = false;
        state.revealProgress = 0;
        render();
        return;
      }
    }

    function startAnalysis() {
      const link = document.getElementById("source-link");
      if (!state.selectedImageUrl && link && link.value.trim()) {
        state.selectedFileName = "来自链接的内容";
      }
      state.screen = "analyzing";
      render();
      const status = document.getElementById("analysis-status");
      const updates = [
        [500, "定位标题、字幕与关键证据…"],
        [1050, "正在生成一张记忆卡…"]
      ];
      updates.forEach(([delay, text]) => {
        setTimeout(() => {
          if (state.screen === "analyzing" && status) status.textContent = text;
        }, delay);
      });
      clearTimeout(state.analysisTimer);
      state.analysisTimer = setTimeout(() => {
        state.cardCount += 1;
        state.currentCard = 0;
        state.selectedPool = "due";
        startDraw("single");
      }, 1650);
    }

    function startDraw(mode, resetIndex = true) {
      clearTimeout(state.summonTimer);
      state.drawMode = mode;
      const poolCards = memoryPools[state.selectedPool].cardIndexes;
      state.sessionCards = mode === "continuous" ? [...poolCards].slice(0, 10) : [poolCards[0]];
      state.continuousLimit = state.sessionCards.length;
      if (resetIndex) {
        state.sessionPosition = 0;
        state.currentCard = state.sessionCards[0];
      }
      state.revealed = false;
      state.revealProgress = 0;
      state.variantResult = "";
      state.screen = "summon";
      render();
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      state.summonTimer = setTimeout(finishSummon, reduceMotion ? 20 : 1450);
    }

    function finishSummon() {
      if (state.screen !== "summon") return;
      clearTimeout(state.summonTimer);
      state.screen = "draw";
      render();
    }

    function updateRevealProgress(progress) {
      state.revealProgress = Math.min(1, Math.max(0, progress));
      const mask = document.getElementById("semantic-mask");
      const label = document.getElementById("reveal-label");
      if (!mask || !label) return;
      mask.style.opacity = String(Math.max(.22, 1 - state.revealProgress * .75));
      label.textContent = state.revealProgress >= 0.45 ? "正在完整揭示" : `已擦开 ${Math.round(state.revealProgress * 100)}%`;
    }

    function reveal() {
      state.revealed = true;
      state.revealProgress = 1;
      render();
      requestAnimationFrame(() => document.getElementById("answer")?.scrollIntoView({ behavior: "smooth", block: "nearest" }));
    }

    function answerVariant(rawAnswer) {
      const card = cards[state.currentCard];
      const isJudgment = state.currentCard % 2 === 0;
      const correct = isJudgment
        ? (rawAnswer === "true") === card.judgment.correct
        : Number(rawAnswer) === card.choice.correct;
      state.variantResult = correct ? "回答正确 · 现在检查证据" : "这次没有答对 · 不扣分，只会更早复习";
      reveal();
    }

    function assess(value) {
      state.lastAssessment = value;
      state.masteryBefore = state.masteryByCard[state.currentCard];
      state.masteryAfter = nextMastery(state.masteryBefore, value);
      state.masteryByCard[state.currentCard] = state.masteryAfter;
      state.nextReviewByCard[state.currentCard] = value === "forgot" ? 1 : value === "fuzzy" ? 2 : 4;
      state.screen = "complete";
      render();
    }

    function nextMastery(current, assessment) {
      if (current === "sealed") return "awakened";
      if (assessment !== "remembered") return current;
      if (current === "awakened") return "solidified";
      if (current === "solidified") return "engraved";
      return "engraved";
    }

    function showToast(message) {
      clearTimeout(state.toastTimer);
      app.querySelector(".toast")?.remove();
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.setAttribute("role", "status");
      toast.textContent = message;
      app.appendChild(toast);
      state.toastTimer = setTimeout(() => toast.remove(), 1800);
    }

    function resetExperience() {
      clearTimeout(state.analysisTimer);
      clearTimeout(state.summonTimer);
      if (state.selectedImageUrl) URL.revokeObjectURL(state.selectedImageUrl);
      Object.assign(state, {
        screen: "home",
        selectedImageUrl: "",
        selectedFileName: "",
        selectedPool: "due",
        currentCard: 0,
        drawMode: "single",
        continuousLimit: 1,
        sessionCards: [0],
        sessionPosition: 0,
        revealed: false,
        revealProgress: 0,
        lastAssessment: "",
        masteryByCard: ["sealed", "awakened", "awakened"],
        nextReviewByCard: [0, 2, 1],
        variantResult: "",
        mascotTapCount: 0,
        masteryBefore: "sealed",
        masteryAfter: "sealed",
        cardCount: 5
      });
      render();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("desktop-reset").addEventListener("click", resetExperience);
    render();
  </script>

  <script id="recallo-v06-runtime">
    (() => {
      const KEY = "recallo-v06-web-state";
      const phases = new Set(["home","summoning","recall","scratching","revealed","assessing","checkpoint","stowing","paused"]);
      const poses = {
        idle:["idle",""], reacting:["hop","!"], turning:["tilt",""], rummaging:["thinking","…"], carrying:["hop","✦"],
        watching:["idle",""], acknowledging:["success","!"], thinking:["thinking","?"], sleeping:["tilt","z z"], farewell:["success","♡"]
      };
      const colors = {creamReady:"#fff3de",mistProcessing:"#e7eef1",coralRecall:"#f7b99f",lavenderPaused:"#e9e0f1",sageLibrary:"#dbe8d4",navyNight:"#25384d"};
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      const fresh = () => ({phase:"home",tab:"today",mascot:"idle",cardIndex:0,summonCount:0,revealed:false,coverage:0,paths:[],cells:[],assessments:{},lastAssessment:"",resumePhase:"home",lastSummonDuration:0});
      const load = () => { try { const value={...fresh(),...JSON.parse(localStorage.getItem(KEY)||"null")}; if(!phases.has(value.phase)) return fresh(); if(["summoning","stowing"].includes(value.phase)) value.phase="recall"; if(value.phase==="assessing") value.phase=value.assessments[`card-${value.cardIndex}-summon-${value.summonCount}`]?"checkpoint":"revealed"; return value; } catch { return fresh(); } };
      let ui=load(), timers=[], idleTimer=0, lowPower=false;
      const save=()=>localStorage.setItem(KEY,JSON.stringify(ui));
      const clear=()=>{timers.forEach(clearTimeout);timers=[]};
      const later=(fn,ms)=>{const timer=setTimeout(fn,ms);timers.push(timer);return timer};
      const item=()=>cards[((ui.cardIndex%cards.length)+cards.length)%cards.length];
      const escape=value=>String(value??"").replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"}[char]));
      const inSession=()=>!['home','paused'].includes(ui.phase);
      const palette=()=>ui.phase==='paused'?'lavenderPaused':ui.tab==='library'?'sageLibrary':ui.tab==='profile'?'navyNight':['summoning','stowing'].includes(ui.phase)?'mistProcessing':['recall','scratching','revealed','assessing','checkpoint'].includes(ui.phase)?'coralRecall':'creamReady';

      function mascot(state=ui.mascot,interactive=false){
        const [asset,effect]=poses[state]||poses.idle;
        return `<button class="v06-mascot" data-action="mascot" data-state="${state}" data-effect="${effect}" type="button" aria-label="毛球${interactive?'，点它会回应你':'正在陪你回忆'}" ${interactive?'':'tabindex="-1"'}><img src="app-demo-assets/mascot-v06/recallo-mascot-${asset}.png" alt="">${state==='carrying'?'<span class="v06-prop"></span>':''}${state==='rummaging'?'<span class="v06-folder"></span>':''}</button>`;
      }
      const top=(title,action='')=>`<header class="v06-top"><strong>${title}</strong>${action||'<span></span>'}</header>`;
      const nav=()=>`<nav class="v06-nav" aria-label="主要导航">${[['today','☀','今日'],['library','▤','知识库'],['profile','○','我的']].map(([id,icon,label])=>`<button data-tab="${id}" aria-current="${ui.tab===id?'page':'false'}" type="button"><b>${icon}</b>${label}</button>`).join('')}</nav>`;
      function home(){return `<section class="v06-screen" data-testid="v06-home">${top('Recallo · 今日','<button class="v06-icon" aria-label="通知" type="button">◌</button>')}<div class="v06-home">${mascot(ui.mascot,true)}<h2>找回一段自己的过去</h2><p>每次只取回一张。想起多少，都算数。</p><button class="v06-stack" data-action="summon" data-testid="recall-stack" type="button" aria-label="点按、长按或向上拖动，召回一张旧内容"><span class="v06-card-layer"></span><span class="v06-card-layer"></span><span class="v06-card-layer v06-card-front"><span><strong>今天的一张</strong><span>来自你保存过的内容</span></span></span></button><button class="v06-primary" data-action="summon" type="button">让毛球取回一张</button></div>${nav()}</section>`}
      function library(){return `<section class="v06-screen" data-testid="v06-library">${top('知识库')}<h2>被你留下的记忆</h2><p>这里没有伪造的知识图谱，只有真实卡片。</p><div class="v06-list">${cards.map(card=>`<article><strong>${escape(card.rarity)} · ${escape(card.hidden)}</strong><p>${escape(card.cue)}</p><small>${escape(card.source)}</small></article>`).join('')}</div>${nav()}</section>`}
      function profile(){const count=Object.keys(ui.assessments).length;return `<section class="v06-screen" style="--v06-ink:#fffaf0" data-testid="v06-profile">${top('我的')}<div class="v06-scene">${mascot(count?'acknowledging':'sleeping')}<h2>${count?`已经找回 ${count} 张`:'你的过去还安静地待着'}</h2><p style="color:rgba(255,250,240,.78)">不打卡，不排行，只记录真实发生的回忆。</p><button class="v06-primary" style="background:#fffaf0;color:#25384d" data-action="reset" type="button">重置演示</button></div>${nav()}</section>`}
      function stowingView(){return `<section class="v06-screen" data-testid="v06-stowing"><div class="v06-scene">${mascot('farewell')}<h2>先替你把卡收好</h2><p>进度已经留下，下次仍从自己的过去继续。</p></div></section>`}
      function summoning(){return `<section class="v06-screen" data-testid="v06-summoning">${top('正在取回','<button class="v06-subtle" data-action="skip" type="button">跳过</button>')}<div class="v06-scene"><div class="v06-orbit"></div>${mascot()}<article class="v06-summon-card" data-fast="${ui.lastSummonDuration<1000}"><div><span class="v06-rarity">来自你的过去</span><h2>毛球找到了一张</h2><p>${ui.lastSummonDuration}ms · 可随时跳过</p></div></article></div></section>`}
      function scratch(card){return ui.revealed?`<div class="v06-scratch-wrap"><div class="v06-scratch-answer">${escape(card.hidden)}</div></div>`:`<div class="v06-scratch-wrap" data-testid="scratch-area"><div class="v06-scratch-answer">${escape(card.hidden)}</div><canvas class="v06-scratch" tabindex="0" role="button" aria-label="刮开关键语义；回车或空格可直接揭示"></canvas><span class="v06-scratch-label">轻轻刮开 · ${Math.round(ui.coverage*100)}%</span></div>`}
      function recall(){const card=item(),shown=ui.revealed||ui.phase==='revealed';return `<section class="v06-screen" data-testid="v06-recall">${top('先想一想','<button class="v06-subtle" data-action="stow" type="button">先收好</button>')}<div class="v06-scene">${mascot(shown?'thinking':'watching')}<article class="v06-memory" data-rarity="${escape(card.rarity)}"><span class="v06-rarity">${escape(card.rarity)} · 核心潜力</span><h2>${escape(card.cue)}</h2><div class="v06-core">${escape(card.coreBefore)}</div>${scratch(card)}<div class="v06-core">${escape(card.coreAfter)}</div>${shown?`<div class="v06-explanation"><strong>为什么值得记住</strong><br>${escape(card.explanation)}<br><small>${escape(card.source)}</small></div><div class="v06-assess"><button data-assess="remembered">记得</button><button data-assess="fuzzy">模糊</button><button data-assess="forgot">忘记</button></div>`:'<button class="v06-subtle" data-action="reveal" type="button">一键揭示</button>'}</article></div></section>`}
      function assessing(){const map={remembered:['acknowledging','你想起来了，记忆被重新连上。'],fuzzy:['turning','模糊也很好，我们会更早再见。'],forgot:['thinking','忘记不是失败，毛球先替你收好。']},[pose,copy]=map[ui.lastAssessment]||map.fuzzy;return `<section class="v06-screen" data-testid="v06-assessing"><div class="v06-scene">${mascot(pose)}${ui.lastAssessment==='remembered'&&!reduced.matches?'<span class="v06-particles"><i style="left:46%;top:48%;--x:-35px;--y:-45px"></i><i style="left:52%;top:48%;--x:35px;--y:-52px"></i><i style="left:49%;top:52%;--x:-8px;--y:-62px"></i></span>':''}<h2>${copy}</h2><p>反馈只决定下次出现的时间，不改变稀有度。</p></div></section>`}
      function checkpoint(){const card=item();return `<section class="v06-screen" data-testid="v06-checkpoint">${top('这一张，已经找回')}<div class="v06-scene">${mascot(ui.lastAssessment==='remembered'?'acknowledging':'thinking')}<div class="v06-checkpoint"><span class="v06-next-edge"></span><article class="v06-check-card"><span class="v06-rarity">${escape(card.rarity)}</span><h2>${escape(card.hidden)}</h2><p>${escape(card.rarityReason)}</p></article></div><div class="v06-actions"><button class="v06-primary" data-action="continue" type="button">继续下一张</button><button class="v06-subtle" data-action="stow" type="button">先收好</button><small>下一张已经在卡边等你</small></div></div></section>`}
      const paused=()=>`<section class="v06-screen" data-testid="v06-paused"><div class="v06-scene">${mascot('sleeping')}<h2>这张卡替你停在这里</h2><p>回来时仍是同一张，刮开进度也还在。</p><button class="v06-primary" data-action="resume" type="button">继续回忆</button></div></section>`;

      function renderV06(){const name=palette();app.style.setProperty('--v06-stage',colors[name]);app.style.setProperty('--v06-ink',name==='navyNight'?'#fffaf0':'#243f43');if(ui.phase==='paused')app.innerHTML=paused();else if(inSession())app.innerHTML=ui.phase==='stowing'?stowingView():ui.phase==='summoning'?summoning():ui.phase==='assessing'?assessing():ui.phase==='checkpoint'?checkpoint():recall();else app.innerHTML=ui.tab==='library'?library():ui.tab==='profile'?profile():home();bind();if(['recall','scratching'].includes(ui.phase)&&!ui.revealed)setupScratch();save()}
      function startSummon(){clear();ui.tab='today';ui.phase='summoning';ui.mascot='turning';ui.lastSummonDuration=reduced.matches?180:ui.summonCount===0?1450:700;renderV06();if(!reduced.matches){later(()=>{ui.mascot='rummaging';renderV06()},Math.min(240,ui.lastSummonDuration*.25));later(()=>{ui.mascot='carrying';renderV06()},Math.min(720,ui.lastSummonDuration*.62))}later(finishSummon,ui.lastSummonDuration)}
      function finishSummon(){clear();ui.phase='recall';ui.mascot='watching';ui.summonCount+=1;renderV06()}
      function reveal(){ui.revealed=true;ui.coverage=1;ui.phase='revealed';ui.mascot='thinking';renderV06()}
      function assess(value){const key=`card-${ui.cardIndex}-summon-${ui.summonCount}`;if(ui.assessments[key]){ui.phase='checkpoint';renderV06();return}ui.assessments[key]=value;ui.lastAssessment=value;ui.phase='assessing';renderV06();later(()=>{ui.phase='checkpoint';renderV06()},reduced.matches?180:620)}
      function next(){clear();ui.cardIndex=(ui.cardIndex+1)%cards.length;ui.revealed=false;ui.coverage=0;ui.paths=[];ui.cells=[];ui.lastAssessment='';startSummon()}
      function stow(){clear();const completed=ui.phase==='checkpoint';if(completed){ui.cardIndex=(ui.cardIndex+1)%cards.length;ui.revealed=false;ui.coverage=0;ui.paths=[];ui.cells=[];ui.lastAssessment=''}ui.phase='stowing';ui.mascot='farewell';renderV06();later(()=>{ui.phase='home';ui.tab='today';ui.mascot='idle';renderV06();scheduleIdle()},reduced.matches?180:520)}
      function reset(){clear();clearTimeout(idleTimer);localStorage.removeItem(KEY);ui=fresh();renderV06();scheduleIdle()}

      function setupScratch(){const canvas=app.querySelector('.v06-scratch');if(!canvas)return;const rect=canvas.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1),ctx=canvas.getContext('2d');canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.scale(dpr,dpr);ctx.fillStyle='#c9c4b8';ctx.fillRect(0,0,rect.width,rect.height);ctx.strokeStyle='rgba(91,88,82,.22)';ctx.lineWidth=2;for(let y=8;y<rect.height;y+=9){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(rect.width,y-5);ctx.stroke()}ctx.globalCompositeOperation='destination-out';ctx.lineWidth=26;ctx.lineCap='round';ctx.lineJoin='round';let previous=null;ui.paths.forEach(point=>{const p={x:point.x*rect.width,y:point.y*rect.height};if(point.move||!previous){previous=p;return}ctx.beginPath();ctx.moveTo(previous.x,previous.y);ctx.lineTo(p.x,p.y);ctx.stroke();previous=p});let drawing=false;const pos=event=>({x:Math.max(0,Math.min(rect.width,event.clientX-rect.left)),y:Math.max(0,Math.min(rect.height,event.clientY-rect.top))});const mark=(point,move=false)=>{ui.phase='scratching';const p={x:point.x/rect.width,y:point.y/rect.height,move},last=ui.paths.at(-1);ui.paths.push(p);if(last&&!move){ctx.beginPath();ctx.moveTo(last.x*rect.width,last.y*rect.height);ctx.lineTo(point.x,point.y);ctx.stroke()}const cx=Math.floor(p.x*12),cy=Math.floor(p.y*7),radiusX=Math.max(0,Math.round(13/(rect.width/12))),radiusY=Math.max(0,Math.round(13/(rect.height/7)));for(let dx=-radiusX;dx<=radiusX;dx++)for(let dy=-radiusY;dy<=radiusY;dy++)if(cx+dx>=0&&cx+dx<12&&cy+dy>=0&&cy+dy<7)ui.cells.push(`${cx+dx}:${cy+dy}`);ui.cells=[...new Set(ui.cells)];ui.coverage=Math.min(1,ui.cells.length/84);const label=app.querySelector('.v06-scratch-label');if(label)label.textContent=`轻轻刮开 · ${Math.round(ui.coverage*100)}%`;save();if(ui.coverage>=.45)reveal()};canvas.addEventListener('pointerdown',event=>{drawing=true;canvas.setPointerCapture(event.pointerId);mark(pos(event),true)});canvas.addEventListener('pointermove',event=>{if(drawing)mark(pos(event))});canvas.addEventListener('pointerup',event=>{drawing=false;try{canvas.releasePointerCapture(event.pointerId)}catch{}save()});canvas.addEventListener('keydown',event=>{if(['Enter',' '].includes(event.key)){event.preventDefault();reveal()}else if(event.key.startsWith('Arrow')){event.preventDefault();const count=ui.cells.length;for(let i=count;i<Math.min(84,count+12);i++)ui.cells.push(`${i%12}:${Math.floor(i/12)}`);ui.coverage=ui.cells.length/84;ui.coverage>=.45?reveal():renderV06()}})}
      function stackGesture(){const stack=app.querySelector('.v06-stack');if(!stack)return;let startY=0,startX=0,triggered=false,hold=0;stack.addEventListener('pointerdown',event=>{startY=event.clientY;startX=event.clientX;triggered=false;hold=setTimeout(()=>{triggered=true;startSummon()},460)});stack.addEventListener('pointermove',event=>{const dy=event.clientY-startY,dx=event.clientX-startX;stack.style.transform=`translate(${Math.max(-6,Math.min(6,dx/9))}px,${Math.min(0,dy)}px) rotate(${Math.max(-4,Math.min(4,dx/12))}deg)`;if(!triggered&&dy<=-28){triggered=true;clearTimeout(hold);startSummon()}});for(const type of ['pointerup','pointercancel'])stack.addEventListener(type,()=>{clearTimeout(hold);stack.style.transform=''})}
      function bind(){app.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{if(inSession())return;ui.tab=button.dataset.tab;ui.mascot=ui.tab==='today'?'idle':ui.tab==='library'?'watching':'sleeping';renderV06()}));app.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',event=>{const action=event.currentTarget.dataset.action;if(action==='summon')startSummon();else if(action==='skip')finishSummon();else if(action==='reveal')reveal();else if(action==='continue')next();else if(action==='stow')stow();else if(action==='resume'){ui.phase=ui.resumePhase||'recall';renderV06()}else if(action==='reset')reset();else if(action==='mascot'){const old=ui.mascot;ui.mascot='reacting';renderV06();later(()=>{ui.mascot=old==='reacting'?'idle':old;renderV06()},reduced.matches?180:360)}}));app.querySelectorAll('[data-assess]').forEach(button=>button.addEventListener('click',()=>assess(button.dataset.assess)));stackGesture()}
      function scheduleIdle(){clearTimeout(idleTimer);if(reduced.matches||lowPower||document.hidden||ui.phase!=='home'||ui.tab!=='today')return;idleTimer=setTimeout(()=>{const states=['turning','thinking','sleeping','reacting'];ui.mascot=states[Math.floor(Math.random()*states.length)];renderV06();later(()=>{if(ui.phase==='home'){ui.mascot='idle';renderV06();scheduleIdle()}},650)},8000+Math.random()*6000)}
      document.addEventListener('visibilitychange',()=>{if(document.hidden&&inSession()){ui.resumePhase=ui.phase;ui.phase='paused';clear();renderV06()}else if(!document.hidden&&ui.phase==='paused'){ui.phase=ui.resumePhase||'recall';renderV06()}});
      reduced.addEventListener?.('change',()=>{if(ui.phase==='summoning')finishSummon();renderV06();scheduleIdle()});
      navigator.getBattery?.().then(battery=>{const sync=()=>{lowPower=!battery.charging&&battery.level<=.2;scheduleIdle()};battery.addEventListener('levelchange',sync);battery.addEventListener('chargingchange',sync);sync()}).catch(()=>{});
      document.getElementById('desktop-reset').addEventListener('click',event=>{event.stopImmediatePropagation();reset()},true);
      window.__recalloV06={getState:()=>JSON.parse(JSON.stringify(ui)),startSummon,reveal,assess,continueNext:next,stow,reset,render:renderV06};
      renderV06();scheduleIdle();
    })();
  </script>
</body>
</html>
