[project]
name = "social-review-pipeline"
version = "0.1.0"
description = "TikHub social content ingestion and multimodal review pipeline"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.68.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "openai>=1.100.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
]

[project.scripts]
social-review = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
